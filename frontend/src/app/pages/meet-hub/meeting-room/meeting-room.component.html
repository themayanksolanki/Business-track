<div class="meeting-room">
  <div class="room-banner" *ngIf="meetingSessionSvc.roomFull">This meeting is full (max 4 participants).</div>
  <div class="room-banner room-banner-error" *ngIf="meetingSessionSvc.joinError">{{ meetingSessionSvc.joinError }}</div>

  <div class="tile-grid">
    <app-video-tile
      [stream]="meetingSessionSvc.localStream"
      [label]="myUsername + ' (You)'"
      [user]="myUser"
      [muted]="true"
      [camOff]="meetingSessionSvc.isCamOff"
    ></app-video-tile>

    <app-video-tile
      *ngFor="let tile of meetingSessionSvc.remoteTiles"
      [stream]="tile.stream"
      [label]="participantLabel(tile.userId)"
      [user]="participantUser(tile.userId)"
      [muted]="false"
      [camOff]="meetingSessionSvc.isPeerCamOff(tile.socketId)"
    ></app-video-tile>
  </div>

  <div class="room-controls">
    <button class="ctrl-btn" [class.active]="meetingSessionSvc.isMuted" (click)="meetingSessionSvc.toggleMute()">
      <i class="bi" [class.bi-mic-fill]="!meetingSessionSvc.isMuted" [class.bi-mic-mute-fill]="meetingSessionSvc.isMuted"></i>
    </button>
    <button class="ctrl-btn" [class.active]="meetingSessionSvc.isCamOff" (click)="meetingSessionSvc.toggleCamera()">
      <i class="bi" [class.bi-camera-video-fill]="!meetingSessionSvc.isCamOff" [class.bi-camera-video-off-fill]="meetingSessionSvc.isCamOff"></i>
    </button>
    <button class="ctrl-btn" (click)="minimize()" title="Minimize">
      <i class="bi bi-dash-lg"></i>
    </button>
    <button class="ctrl-btn ctrl-btn-leave" (click)="leaveMeeting()">
      <i class="bi bi-telephone-fill"></i> Leave
    </button>
  </div>
</div>
