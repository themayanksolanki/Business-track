<div class="attachment-panel" (click)="$event.stopPropagation()">
  <div class="attachment-panel-header">
    <span class="attachment-panel-title"><i class="bi bi-paperclip me-1"></i>Attachments</span>
    <button type="button" class="attachment-panel-close" (click)="closed.emit()" title="Close">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <div class="attachment-panel-body">
    <app-attachments
      [adapter]="projectService.attachmentsAdapterForItem(projectId, item.id)"
      [reloadKey]="item.id"
      [canEdit]="canEdit"
      (attachmentsChange)="onAttachmentsChange($event)">
    </app-attachments>
  </div>
</div>
