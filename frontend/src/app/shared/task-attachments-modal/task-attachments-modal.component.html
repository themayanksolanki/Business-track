<div class="modal fade" tabindex="-1" aria-hidden="true" [appModal]="open" (appModalClosed)="closed.emit()">
  <div class="modal-dialog modal-dialog-centered tasklist-dialog tasklist-dialog-lg">
  @if (open) {
    <div class="modal-content tasklist-modal-content shadow-lg">
      <div class="modal-header modal-form-header">
        <div class="d-flex justify-content-between align-items-center flex-grow-1">
          <h5 class="mb-0 fw-bold">
            <i class="bi bi-paperclip me-2 text-primary"></i>Attachments
            @if (task) { <span class="text-muted fw-normal">— {{ task.title }}</span> }
          </h5>
          <button type="button" class="detail-x" data-bs-dismiss="modal"><i class="bi bi-x-lg"></i></button>
        </div>
      </div>

      <div class="modal-body p-4">
        @if (task) {
          <app-attachments
            [adapter]="attachmentService.attachmentsAdapter(task.id)"
            [reloadKey]="task.id"
            (attachmentsChange)="onAttachmentsChange($event)">
          </app-attachments>
        }
      </div>
    </div>
  }
  </div>
</div>
